<!DOCTYPE html>  
<html lang="ar" dir="rtl">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1">  
<meta name="theme-color" content="#101827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" id="pwa-manifest">  
<title>نُموّي | NAMOW</title>  
<style>  
:root{  
  --bg:#0b1220;--panel:#152238;--panel2:#1b2b43;  
  --border:#2b3c56;--text:#f1f5f9;--muted:#9aabc2;  
  --green:#42d6a0;--red:#ff7777;--blue:#70b5ff;  
  --yellow:#ffd166;  
}  
*{box-sizing:border-box}  
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}  
header{background:#111c30;padding:18px 16px;border-bottom:1px solid var(--border)}  
header h1{margin:0;color:var(--green);font-size:25px}  
header p{color:var(--muted);font-size:12px;margin:7px 0 0}  
main{max-width:1100px;margin:auto;padding:15px}  
nav{display:flex;gap:8px;overflow:auto;padding:12px 0;position:sticky;top:0;background:var(--bg);z-index:5}  
nav button{white-space:nowrap;width:auto;padding:11px 15px;background:var(--panel);color:var(--text);border:1px solid var(--border)}  
nav button.active{background:var(--green);color:#08251c;border-color:var(--green)}  
button{cursor:pointer;border:0;border-radius:9px;padding:11px 14px;font-weight:bold}  
.primary{background:var(--green);color:#06251c}  
.secondary{background:#263a56;color:white}  
.danger{background:#512b37;color:#ffc0c0}  
.smallbtn{padding:7px 10px;font-size:12px}  
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}  
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}  
.card,.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:15px;margin-bottom:13px}  
.card small,.muted{color:var(--muted)}  
.card h2{font-size:21px;margin:12px 0 0;overflow-wrap:anywhere}  
.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}.yellow{color:var(--yellow)}  
h3{font-size:17px;margin:18px 0 12px}  
h4{margin:0 0 9px}  
input,select,textarea{  
 width:100%;padding:12px;margin:6px 0 12px;border:1px solid var(--border);  
 border-radius:9px;background:#0d192b;color:white;font-size:14px  
}  
label{font-size:13px;color:#c3d0e1}  
form{display:grid;gap:2px}  
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}  
.item{background:var(--panel2);padding:12px;border-radius:10px;margin:8px 0}  
.item small{display:block;color:var(--muted);margin-top:5px}  
.item-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}  
.empty{text-align:center;color:var(--muted);padding:20px}  
.badge{font-size:11px;padding:5px 8px;border-radius:20px;background:#293e5b;color:#dbeafe}  
.hidden{display:none!important}  
.progress{height:9px;background:#293b54;border-radius:20px;overflow:hidden;margin:9px 0}  
.progress span{display:block;height:100%;background:var(--green)}  
hr{border:0;border-top:1px solid var(--border);margin:15px 0}  
table{width:100%;border-collapse:collapse;font-size:12px}  
td,th{padding:9px;text-align:right;border-bottom:1px solid var(--border)}  
footer{text-align:center;color:#71829a;font-size:11px;padding:25px}  
#lockScreen{position:fixed;inset:0;background:#09111f;z-index:99;display:none;align-items:center;justify-content:center;padding:20px}  
#lockScreen .panel{width:100%;max-width:350px}  
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}  
@media(max-width:420px){.grid3{grid-template-columns:repeat(2,1fr)}}  
</style>  
</head>  
<body>  
<div id="lockScreen">  
  <div class="panel">  
    <h2 class="green">نُموّي | NAMOW</h2>  
    <p class="muted">أدخل رمز PIN لفتح التطبيق</p>  
    <input id="unlockPin" type="password" inputmode="numeric" placeholder="رمز PIN">  
    <button class="primary" style="width:100%" onclick="unlockApp()">فتح التطبيق</button>  
    <p id="lockError" class="red"></p>  
  </div>  
</div>  

<header>  
  <div class="row">  
    <div>  
      <h1>نُموّي | NAMOW</h1>  
      <p>إدارة أموالك وبناء مستقبلك المالي</p>  
    </div>  
    <span class="badge">EGP • جنيه مصري</span>  
  </div>  
</header>  

<main>  
<nav id="nav"></nav>  
<div id="app"></div>  
<footer>NAMOW © 2026 — بياناتك محفوظة محلياً على هذا الجهاز</footer>  
</main>  

<script>  
"use strict";  
  
/* =========================  
   PWA Dynamic Initialization  
========================= */  
if ('serviceWorker' in navigator) {  
  window.addEventListener('load', () => {  
    const manifest = {  
      "name": "نُموّي | NAMOW",  
      "short_name": "نُموّي",  
      "start_url": "./",  
      "display": "standalone",  
      "background_color": "#0b1220",  
      "theme_color": "#101827",  
      "icons": [  
        {  
          "src": "https://img.icons8.com/color/512/wallet.png",  
          "sizes": "512x512",  
          "type": "image/png",  
          "purpose": "any maskable"  
        }  
      ]  
    };  
    const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});  
    document.getElementById('pwa-manifest').href = URL.createObjectURL(manifestBlob);  

    const swCode = `  
      self.addEventListener('install', (e) => { self.skipWaiting(); });  
      self.addEventListener('activate', (e) => { e.waitUntil(clients.claim()); });  
      self.addEventListener('fetch', (e) => {});  
    `;  
    const swBlob = new Blob([swCode], {type: 'text/javascript'});  
    navigator.serviceWorker.register(URL.createObjectURL(swBlob))  
      .catch(err => console.log('SW registration failed', err));  
  });  
}  

/* =========================  
   1. قاعدة البيانات المحلية  
========================= */  
  
const KEY = "namow_complete_v1";  
  
const emptyData = {  
  openingBalance:0,  
  transactions:[],  
  debts:[],  
  goals:[],  
  associations:[],  
  obligations:[],  
  assets:[],  
  allocations:[],  
  adjustments:[],  
  pin:""  
};  
  
let db = loadData();  
let currentTab = "dashboard";  
  
function loadData(){  
  try{  
    const saved = JSON.parse(localStorage.getItem(KEY));  
    return saved ? {...emptyData,...saved} : {...emptyData};  
  }catch(e){  
    return {...emptyData};  
  }  
}  
  
function save(){  
  localStorage.setItem(KEY,JSON.stringify(db));  
}  
  
function id(){  
  return Date.now().toString(36)+Math.random().toString(36).slice(2,7);  
}  
  
function money(n){  
  return Number(n||0).toLocaleString("ar-EG",{  
    maximumFractionDigits:2  
  })+" ج.م";  
}  
  
function number(v){  
  return Number(v)||0;  
}  
  
function dateNow(){  
  return new Date().toISOString().slice(0,10);  
}  
  
function safe(s){  
  return String(s??"").replace(/[&<>"']/g,c=>({  
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"  
  })[c]);  
}  
  
function totals(){  
  let income=0,expense=0;  
  db.transactions.forEach(t=>{  
    if(t.type==="income") income+=number(t.amount);  
    if(t.type==="expense") expense+=number(t.amount);  
  });  
  return {  
    income,expense,  
    balance:number(db.openingBalance)+income-expense  
  };  
}  
  
function update(){  
  save();  
  render();  
}  
  
function field(label,name,type="text",placeholder="",required=true){  
  return `<label>${label}</label>  
  <input name="${name}" type="${type}" placeholder="${placeholder}"  
  ${required?"required":""} ${type==="number"?'step="0.01" min="0"':""}>`;  
}  
  
function selectField(label,name,options){  
  return `<label>${label}</label><select name="${name}" required>  
  ${options.map(o=>`<option value="${safe(o[0])}">${safe(o[1])}</option>`).join("")}  
  </select>`;  
}  
  
function formBox(title,content,button="حفظ"){  
  return `<div class="panel"><h3>${title}</h3>  
  <form class="dataForm">${content}  
  <button class="primary" type="submit">${button}</button>  
  </form></div>`;  
}  
  
function itemBox(title,subtitle,amount,actions="",color=""){  
  return `<div class="item">  
    <div class="row"><strong>${safe(title)}</strong>  
    <strong class="${color}">${amount}</strong></div>  
    <small>${safe(subtitle||"")}</small>  
    ${actions?`<div class="item-actions">${actions}</div>`:""}  
  </div>`;  
}  
  
function actionBtn(action,idValue,text,cls="secondary"){  
  return `<button type="button" class="${cls} smallbtn"  
  data-action="${action}" data-id="${idValue}">${text}</button>`;  
}  
  
function sectionList(title,items){  
  return `<h3>${title}</h3>${items.length?items.join(""):'<div class="empty">لا توجد بيانات حتى الآن</div>'}`;  
}  
  
/* =========================  
   2. التنقل بين الأقسام  
========================= */  
  
const tabs = [  
 ["dashboard","الرئيسية"],  
 ["transactions","الدخل والمصروفات"],  
 ["debts","الديون"],  
 ["associations","الجمعيات"],  
 ["obligations","الالتزامات"],  
 ["goals","الادخار"],  
 ["assets","الأصول والاستثمارات"],  
 ["planning","تقسيم الدخل"],  
 ["reports","التقارير"],  
 ["settings","الإعدادات"]  
];  
  
function render(){  
  document.getElementById("nav").innerHTML = tabs.map(t=>  
    `<button class="${currentTab===t[0]?"active":""}"  
    data-tab="${t[0]}">${t[1]}</button>`  
  ).join("");  
  
  const pages = {  
    dashboard:dashboardPage,  
    transactions:transactionsPage,  
    debts:debtsPage,  
    associations:associationsPage,  
    obligations:obligationsPage,  
    goals:goalsPage,  
    assets:assetsPage,  
    planning:planningPage,  
    reports:reportsPage,  
    settings:settingsPage  
  };  
  
  document.getElementById("app").innerHTML = pages[currentTab]();  
}  
  
/* =========================  
   3. الرئيسية  
========================= */  
  
function dashboardPage(){  
  const t=totals();  
  const debtsOwed=db.debts.filter(d=>d.direction==="iowe")  
    .reduce((s,d)=>s+number(d.remaining),0);  
  const debtsToMe=db.debts.filter(d=>d.direction==="theyowe")  
    .reduce((s,d)=>s+number(d.remaining),0);  
  const goalsTotal=db.goals.reduce((s,g)=>s+number(g.saved),0);  
  const assetsTotal=db.assets.reduce((s,a)=>s+number(a.value),0);  
  
  const recent=[...db.transactions].reverse().slice(0,5).map(x=>  
    itemBox(x.title,x.date+" • "+x.category,  
      (x.type==="income"?"+":"-")+money(x.amount),"",  
      x.type==="income"?"green":"red")  
  );  
  
  const due=db.obligations.filter(o=>!o.paid).length;  
  
  return `  
  <h3>ملخص أموالك</h3>  
  <div class="grid">  
    <div class="card"><small>الرصيد الحالي</small><h2 class="green">${money(t.balance)}</h2></div>  
    <div class="card"><small>دخل مسجل</small><h2>${money(t.income)}</h2></div>  
    <div class="card"><small>مصروفات مسجلة</small><h2 class="red">${money(t.expense)}</h2></div>  
    <div class="card"><small>التزامات غير مدفوعة</small><h2 class="yellow">${due}</h2></div>  
    <div class="card"><small>ديون عليك</small><h2 class="red">${money(debtsOwed)}</h2></div>  
    <div class="card"><small>ديون لك</small><h2 class="green">${money(debtsToMe)}</h2></div>  
    <div class="card"><small>مدخراتك</small><h2>${money(goalsTotal)}</h2></div>  
    <div class="card"><small>قيمة أصولك</small><h2>${money(assetsTotal)}</h2></div>  
  </div>  
  <div class="panel">  
    <h3>الرصيد الافتتاحي</h3>  
    <p class="muted">الرصيد الذي بدأت به استخدام التطبيق: ${money(db.openingBalance)}</p>  
    <button class="secondary" data-tab="settings">إعداد الرصيد والإعدادات</button>  
  </div>  
  ${sectionList("آخر العمليات",recent)}  
  <div class="panel">  
    <h3>تنبيه سريع</h3>  
    <p class="muted">راجع الالتزامات ومواعيد الديون والجمعيات بانتظام.</p>  
    <button class="primary" data-tab="obligations">عرض الالتزامات</button>  
  </div>`;  
}  
  
/* =========================  
   4. الدخل والمصروفات  
========================= */  
  
function transactionsPage(){  
  const form=formBox("إضافة عملية مالية",`  
    ${selectField("نوع العملية","type",[  
      ["income","دخل"],["expense","مصروف"]  
    ])}  
    ${field("اسم العملية","title","text","مثلاً راتب أو مشتريات")}  
    ${field("المبلغ بالجنيه","amount","number")}  
    ${selectField("التصنيف","category",[  
      ["راتب","راتب"],["عمل إضافي","عمل إضافي"],  
      ["طعام","طعام"],["مواصلات","مواصلات"],  
      ["فواتير","فواتير"],["تسوق","تسوق"],  
      ["ترفيه","ترفيه"],["صحة","صحة"],["أخرى","أخرى"]  
    ])}  
    ${field("التاريخ","date","date")}  
    ${field("ملاحظات","note","text","اختياري",false)}  
  `);  
  
  const items=[...db.transactions].reverse().map(t=>  
    itemBox(t.title,t.date+" • "+t.category,  
      (t.type==="income"?"+":"-")+money(t.amount),  
      actionBtn("deleteTransaction",t.id,"حذف","danger"),  
      t.type==="income"?"green":"red")  
  );  
  
  return form+sectionList("سجل العمليات",items);  
}  
  
/* =========================  
   5. الديون  
========================= */  
  
function debtsPage(){  
  const form=formBox("إضافة دين",`  
    ${selectField("نوع الدين","direction",[  
      ["iowe","دين عليّ"],["theyowe","دين لي عند شخص"]  
    ])}  
    ${field("اسم الشخص","person")}  
    ${field("إجمالي الدين","amount","number")}  
    ${field("تاريخ الاستحقاق","due","date", "",false)}  
    ${field("ملاحظات","note","text","اختياري",false)}  
  `);  
  
  const items=db.debts.map(d=>{  
    const type=d.direction==="iowe"?"عليك":"لك";  
    return itemBox(d.person+" — دين "+type,  
      "الأصل: "+money(d.amount)+" • المتبقي: "+money(d.remaining),  
      money(d.remaining),  
      actionBtn("debtPayment",d.id,"تسجيل دفعة")+  
      actionBtn("deleteDebt",d.id,"حذف","danger"),  
      d.direction==="iowe"?"red":"green");  
  });  
  
  return form+sectionList("الديون المسجلة",items);  
}  
  
/* =========================  
   6. الجمعيات  
========================= */  
  
function associationsPage(){  
  const form=formBox("إضافة جمعية",`  
    ${field("اسم الجمعية","name")}  
    ${selectField("نوع الجمعية","direction",[  
      ["pay","بدفع قسط"],["receive","هقبض الجمعية"]  
    ])}  
    ${field("قيمة القسط الشهري","installment","number")}  
    ${field("عدد الشهور","months","number")}  
    ${field("دور القبض (رقم الشهر)","turn","number")}  
    ${field("موعد القسط القادم","nextDate","date")}  
  `);  
  
  const items=db.associations.map(a=>  
    itemBox(a.name,  
      "القسط: "+money(a.installment)+" • المدفوع: "+a.paidMonths+"/"+a.months+  
      " • دور القبض: "+a.turn,  
      money(a.installment*Math.max(0,a.months-a.paidMonths)),  
      actionBtn("associationPayment",a.id,"تسجيل قسط")+  
      actionBtn("deleteAssociation",a.id,"حذف","danger"))  
  );  
  
  return form+sectionList("الجمعيات",items);  
}  
  
/* =========================  
   7. الالتزامات والفواتير  
========================= */  
  
function obligationsPage(){  
  const form=formBox("إضافة التزام",`  
    ${field("اسم الالتزام","name")}  
    ${field("المبلغ","amount","number")}  
    ${field("تاريخ الاستحقاق","due","date")}  
    ${selectField("نوع الالتزام","kind",[  
      ["monthly","شهري"],["one","مرة واحدة"],["yearly","سنوي"]  
    ])}  
  `);  
  
  const items=db.obligations.map(o=>  
    itemBox(o.name,o.due+" • "+o.kind,money(o.amount),  
      (o.paid?"<span class='badge'>تم الدفع</span>":  
      actionBtn("payObligation",o.id,"تسجيل الدفع"))+  
      actionBtn("deleteObligation",o.id,"حذف","danger"),  
      o.paid?"green":"yellow")  
  );  
  
  return form+sectionList("الالتزامات",items);  
}  
  
/* =========================  
   8. أهداف الادخار  
========================= */  
  
function goalsPage(){  
  const form=formBox("إنشاء هدف ادخار",`  
    ${field("اسم الهدف","name")}  
    ${field("المبلغ المستهدف","target","number")}  
    ${field("المبلغ الذي ادخرته بالفعل","saved","number")}  
    ${field("الموعد المستهدف","deadline","date", "",false)}  
  `);  
  
  const items=db.goals.map(g=>{  
    const percent=g.target?Math.min(100,g.saved/g.target*100):0;  
    return itemBox(g.name,  
      "تم ادخار "+money(g.saved)+" من "+money(g.target),  
      Math.round(percent)+"%",  
      `<div class="progress"><span style="width:${percent}%"></span></div>`+  
      actionBtn("goalDeposit",g.id,"إضافة ادخار")+  
      actionBtn("deleteGoal",g.id,"حذف","danger"));  
  });  
  
  return form+sectionList("أهداف الادخار",items);  
}  
  
/* =========================  
   9. الأصول والاستثمارات  
========================= */  
  
function assetsPage(){  
  const form=formBox("إضافة أصل أو استثمار",`  
    ${field("اسم الأصل","name")}  
    ${selectField("نوع الأصل","kind",[  
      ["gold","ذهب"],["stocks","أسهم"],  
      ["cash","نقد ومدخرات"],["property","عقار أو أرض"],  
      ["other","أخرى"]  
    ])}  
    ${field("تكلفة الشراء","cost","number")}  
    ${field("القيمة الحالية","value","number")}  
    ${field("تاريخ الشراء","date","date","",false)}  
    ${field("ملاحظات","note","text","اختياري",false)}  
  `);  
  
  const items=db.assets.map(a=>{  
    const change=a.value-a.cost;  
    return itemBox(a.name+" • "+a.kind,  
      "تكلفة الشراء: "+money(a.cost)+" • التغير: "+money(change),  
      money(a.value),  
      actionBtn("updateAsset",a.id,"تحديث القيمة")+  
      actionBtn("deleteAsset",a.id,"حذف","danger"),  
      change>=0?"green":"red");  
  });  
  
  const total=db.assets.reduce((s,a)=>s+a.value,0);  
  return `<div class="card"><small>إجمالي قيمة الأصول</small><h2>${money(total)}</h2></div>`+  
    form+sectionList("سجل الأصول والاستثمارات",items);  
}  
  
/* =========================  
   10. تقسيم الدخل  
========================= */  
  
function planningPage(){  
  return `  
  <div class="panel">  
    <h3>تقسيم الدخل</h3>  
    <p class="muted">اكتب الدخل وحدد النسب، أو استخدم الاقتراح المبدئي ثم عدّله.</p>  
    <form id="planForm">  
      ${field("الدخل المراد تقسيمه","income","number")}  
      ${field("الاحتياجات الأساسية %","needs","number")}  
      ${field("الادخار %","saving","number")}  
      ${field("الترفيه %","fun","number")}  
      ${field("الاستثمار %","invest","number")}  
      <button class="primary">احسب التقسيم</button>  
    </form>  
    <div id="planResult"></div>  
  </div>  
  <div class="panel">  
    <h3>اقتراح مبدئي قابل للتعديل</h3>  
    <p>الاحتياجات الأساسية: 50%</p>  
    <p>الادخار: 20%</p>  
    <p>الترفيه: 10%</p>  
    <p>الاستثمار: 20%</p>  
    <p class="muted">دي نسب إرشادية وليست قاعدة إلزامية. عدّلها حسب دخلك والتزاماتك.</p>  
  </div>`;  
}  
  
/* =========================  
   11. التقارير  
========================= */  
  
function reportsPage(){  
  const t=totals();  
  const byCategory={};  
  db.transactions.filter(x=>x.type==="expense").forEach(x=>{  
    byCategory[x.category]=(byCategory[x.category]||0)+x.amount;  
  });  
  
  const categories=Object.entries(byCategory).sort((a,b)=>b[1]-a[1]);  
  
  const rows=categories.map(([name,value])=>  
    `<tr><td>${safe(name)}</td><td>${money(value)}</td></tr>`  
  ).join("");  
  
  return `  
  <div class="grid">  
    <div class="card"><small>إجمالي الدخل</small><h2 class="green">${money(t.income)}</h2></div>  
    <div class="card"><small>إجمالي المصروفات</small><h2 class="red">${money(t.expense)}</h2></div>  
    <div class="card"><small>صافي التدفق</small><h2>${money(t.income-t.expense)}</h2></div>  
    <div class="card"><small>عدد العمليات</small><h2>${db.transactions.length}</h2></div>  
  </div>  
  <div class="panel">  
    <h3>المصروفات حسب التصنيف</h3>  
    ${categories.length?`<table><thead><tr><th>التصنيف</th><th>المبلغ</th></tr></thead><tbody>${rows}</tbody></table>`:'<p class="empty">لا توجد مصروفات مسجلة</p>'}  
  </div>  
  <div class="panel">  
    <h3>تقرير الشهر الحالي</h3>  
    <p class="muted">يعتمد على العمليات المسجلة في الشهر الحالي فقط.</p>  
    <div id="monthReport"></div>  
  </div>  
  <div class="panel">  
    <button class="primary" onclick="exportCSV()">تصدير العمليات CSV</button>  
  </div>`;  
}  
  
/* =========================  
   12. الإعدادات والنسخ الاحتياطي  
========================= */  
  
function settingsPage(){  
  return `  
  <div class="panel">  
    <h3>الرصيد الافتتاحي</h3>  
    <p class="muted">اكتب رصيدك عند بداية استخدام التطبيق. لا تسجل الرصيد الحالي إذا كنت قد سجلت عمليات سابقة بالفعل.</p>  
    <form id="openingForm">  
      ${field("الرصيد الافتتاحي","opening","number")}  
      <button class="primary">حفظ الرصيد</button>  
    </form>  
  </div>  
  
  <div class="panel">  
    <h3>الحماية برمز PIN</h3>  
    <form id="pinForm">  
      ${field("رمز PIN جديد (4 أرقام على الأقل)","pin","password")}  
      <button class="primary">حفظ PIN</button>  
    </form>  
    <button class="secondary" onclick="removePin()">إلغاء رمز PIN</button>  
    <p class="muted">رمز PIN هنا قفل بسيط للتطبيق، وليس تشفيراً لقاعدة البيانات.</p>  
  </div>  
  
  <div class="panel">  
    <h3>النسخ الاحتياطي</h3>  
    <p class="muted">احفظ نسخة JSON في مكان آمن، واسترجعها عند تغيير الجهاز.</p>  
    <button class="primary" onclick="backup()">تنزيل نسخة احتياطية</button>  
    <hr>  
    <label>استرجاع نسخة احتياطية JSON</label>  
    <input id="restoreFile" type="file" accept=".json,application/json">  
    <button class="secondary" onclick="restoreBackup()">استرجاع البيانات</button>  
  </div>  
  
  <div class="panel">  
    <h3>تصدير البيانات</h3>  
    <button class="secondary" onclick="exportCSV()">تصدير سجل العمليات CSV</button>  
  </div>  
  
  <div class="panel">  
    <h3>إدارة البيانات</h3>  
    <button class="danger" onclick="resetAll()">حذف كل بيانات التطبيق</button>  
  </div>`;  
}  
  
/* =========================  
   13. معالجة النماذج  
========================= */  
  
document.addEventListener("submit",function(e){  
  e.preventDefault();  
  const f=e.target;  
  const v=Object.fromEntries(new FormData(f).entries());  
  
  if(f.id==="planForm"){  
    const income=number(v.income);  
    const values=[number(v.needs),number(v.saving),number(v.fun),number(v.invest)];  
    const sum=values.reduce((a,b)=>a+b,0);  
  
    if(sum!==100){  
      alert("مجموع النسب لازم يساوي 100%");  
      return;  
    }  
  
    document.getElementById("planResult").innerHTML=  
      ["الاحتياجات الأساسية","الادخار","الترفيه","الاستثمار"]  
      .map((name,i)=>`<div class="item">${name}: <strong>${money(income*values[i]/100)}</strong> (${values[i]}%)</div>`)  
      .join("");  
    return;  
  }  
  
  if(f.id==="openingForm"){  
    db.openingBalance=number(v.opening);  
    update();  
    alert("تم حفظ الرصيد الافتتاحي");  
    return;  
  }  
  
  if(f.id==="pinForm"){  
    if(!/^\d{4,12}$/.test(v.pin)){  
      alert("PIN لازم يكون من 4 إلى 12 رقم");  
      return;  
    }  
    db.pin=v.pin;  
    update();  
    alert("تم حفظ PIN");  
    return;  
  }  
  
  if(f.classList.contains("dataForm")){  
    const tab=currentTab;  
  
    if(tab==="transactions"){  
      const amount=number(v.amount);  
      if(amount<=0)return alert("اكتب مبلغاً صحيحاً");  
      if(v.type==="expense" && amount>totals().balance)  
        return alert("الرصيد غير كافٍ");  
      db.transactions.push({  
        id:id(),type:v.type,title:v.title,amount,  
        category:v.category,date:v.date||dateNow(),note:v.note  
      });  
    }  
  
    if(tab==="debts"){  
      const amount=number(v.amount);  
      if(amount<=0)return alert("اكتب مبلغاً صحيحاً");  
      db.debts.push({  
        id:id(),...v,amount,remaining:amount  
      });  
    }  
  
    if(tab==="associations"){  
      const months=Math.floor(number(v.months));  
      const installment=number(v.installment);  
      if(months<=0||installment<=0)return alert("راجع القسط وعدد الشهور");  
      db.associations.push({  
        id:id(),...v,months,installment,paidMonths:0  
      });  
    }  
  
    if(tab==="obligations"){  
      const amount=number(v.amount);  
      if(amount<=0)return alert("اكتب مبلغاً صحيحاً");  
      db.obligations.push({  
        id:id(),...v,amount,paid:false  
      });  
    }  
  
    if(tab==="goals"){  
      const target=number(v.target);  
      const saved=number(v.saved);  
      if(target<=0||saved>target)return alert("راجع الهدف والمبلغ المدخر");  
      db.goals.push({id:id(),...v,target,saved});  
    }  
  
    if(tab==="assets"){  
      const cost=number(v.cost),value=number(v.value);  
      db.assets.push({id:id(),...v,cost,value});  
    }  
  
    update();  
    return;  
  }  
});  
  
/* =========================  
   14. الأزرار والتنقل  
========================= */  
  
document.addEventListener("click",function(e){  
  const tab=e.target.closest("[data-tab]");  
  if(tab){  
    currentTab=tab.dataset.tab;  
    render();  
    return;  
  }  
  
  const btn=e.target.closest("[data-action]");  
  if(!btn)return;  
  
  const action=btn.dataset.action;  
  const itemId=btn.dataset.id;  
  
  if(action==="deleteTransaction")  
    removeItem("transactions",itemId);  
  
  if(action==="deleteDebt")  
    removeItem("debts",itemId);  
  
  if(action==="deleteAssociation")  
    removeItem("associations",itemId);  
  
  if(action==="deleteObligation")  
    removeItem("obligations",itemId);  
  
  if(action==="deleteGoal")  
    removeItem("goals",itemId);  
  
  if(action==="deleteAsset")  
    removeItem("assets",itemId);  
  
  if(action==="debtPayment")debtPayment(itemId);  
  if(action==="associationPayment")associationPayment(itemId);  
  if(action==="payObligation")payObligation(itemId);  
  if(action==="goalDeposit")goalDeposit(itemId);  
  if(action==="updateAsset")updateAsset(itemId);  
});  
  
function removeItem(collection,itemId){  
  if(!confirm("هل تريد حذف هذا العنصر؟"))return;  
  db[collection]=db[collection].filter(x=>x.id!==itemId);  
  update();  
}  
  
function addTransaction(type,title,amount,category){  
  if(amount<=0)return;  
  db.transactions.push({  
    id:id(),type,title,amount,category,  
    date:dateNow()  
  });  
}  
  
function debtPayment(itemId){  
  const d=db.debts.find(x=>x.id===itemId);  
  if(!d)return;  
  
  const value=number(prompt("اكتب قيمة الدفعة"));  
  if(value<=0||value>d.remaining)return alert("قيمة الدفعة غير صحيحة");  
  
  d.remaining-=value;  
  
  if(d.direction==="iowe")  
    addTransaction("expense","سداد دين: "+d.person,value,"سداد ديون");  
  else  
    addTransaction("income","تحصيل دين من: "+d.person,value,"تحصيل ديون");  
  
  update();  
}  
  
function associationPayment(itemId){  
  const a=db.associations.find(x=>x.id===itemId);  
  if(!a||a.paidMonths>=a.months)return;  
  
  if(a.direction==="pay"&&a.installment>totals().balance)  
    return alert("الرصيد لا يكفي للقسط");  
  
  a.paidMonths++;  
  
  if(a.direction==="pay")  
    addTransaction("expense","قسط جمعية: "+a.name,a.installment,"جمعيات");  
  
  if(a.direction==="receive")  
    addTransaction("income","قبض جمعية: "+a.name,a.installment,"جمعيات");  
  
  update();  
}  
  
function payObligation(itemId){  
  const o=db.obligations.find(x=>x.id===itemId);  
  if(!o||o.paid)return;  
  
  if(o.amount>totals().balance)  
    return alert("الرصيد لا يكفي");  
  
  o.paid=true;  
  addTransaction("expense","دفع التزام: "+o.name,o.amount,"التزامات");  
  update();  
}  
  
function goalDeposit(itemId){  
  const g=db.goals.find(x=>x.id===itemId);  
  if(!g)return;  
  
  const value=number(prompt("اكتب المبلغ الذي أضفته للادخار"));  
  if(value<=0||value>totals().balance)return alert("المبلغ غير صحيح أو الرصيد غير كافٍ");  
  
  g.saved+=value;  
  addTransaction("expense","تحويل إلى هدف ادخار: "+g.name,value,"ادخار");  
  update();  
}  
  
function updateAsset(itemId){  
  const a=db.assets.find(x=>x.id===itemId);  
  if(!a)return;  
  
  const value=prompt("القيمة الحالية الجديدة",a.value);  
  if(value===null)return;  
  if(!Number.isFinite(Number(value))||Number(value)<0)  
    return alert("اكتب قيمة صحيحة");  
  
  a.value=Number(value);  
  update();  
}  
  
/* =========================  
   15. التقارير الشهرية  
========================= */  
  
function monthlyReport(){  
  const month=dateNow().slice(0,7);  
  let income=0,expense=0;  
  
  db.transactions.filter(t=>t.date.startsWith(month)).forEach(t=>{  
    if(t.type==="income")income+=t.amount;  
    else expense+=t.amount;  
  });  
  
  const target=document.getElementById("monthReport");  
  if(target){  
    target.innerHTML=`  
      <p>دخل الشهر: <strong class="green">${money(income)}</strong></p>  
      <p>مصروفات الشهر: <strong class="red">${money(expense)}</strong></p>  
      <p>الصافي: <strong>${money(income-expense)}</strong></p>`;  
  }  
}  
  
/* =========================  
   16. النسخ الاحتياطي  
========================= */  
  
function backup(){  
  const blob=new Blob([JSON.stringify(db,null,2)],{  
    type:"application/json"  
  });  
  const url=URL.createObjectURL(blob);  
  const a=document.createElement("a");  
  a.href=url;  
  a.download="NAMOW-backup-"+dateNow()+".json";  
  a.click();  
  URL.revokeObjectURL(url);  
}  
  
function restoreBackup(){  
  const file=document.getElementById("restoreFile").files[0];  
  if(!file)return alert("اختار ملف النسخة الاحتياطية أولاً");  
  if(!confirm("استرجاع النسخة سيستبدل البيانات الحالية. هل تريد المتابعة؟"))return;  
  
  const reader=new FileReader();  
  reader.onload=()=>{  
    try{  
      const restored=JSON.parse(reader.result);  
      const required=["transactions","debts","goals","associations","obligations","assets"];  
      if(!required.every(k=>Array.isArray(restored[k])))  
        throw new Error("Invalid backup");  
  
      db={...emptyData,...restored};  
      save();  
      render();  
      alert("تم استرجاع البيانات");  
    }catch(e){  
      alert("ملف النسخة الاحتياطية غير صالح");  
    }  
  };  
  reader.readAsText(file);  
}  
  
function exportCSV(){  
  const rows=[["النوع","الاسم","المبلغ","التصنيف","التاريخ"]];  
  db.transactions.forEach(t=>{  
    rows.push([  
      t.type==="income"?"دخل":"مصروف",  
      t.title,t.amount,t.category,t.date  
    ]);  
  });  
  
  const csv="\uFEFF"+rows.map(row=>  
    row.map(x=>'"'+String(x??"").replace(/"/g,'""')+'"').join(",")  
  ).join("\n");  
  
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});  
  const url=URL.createObjectURL(blob);  
  const a=document.createElement("a");  
  a.href=url;  
  a.download="NAMOW-transactions.csv";  
  a.click();  
  URL.revokeObjectURL(url);  
}  
  
function resetAll(){  
  if(!confirm("تحذير: سيتم حذف كل البيانات نهائياً من هذا المتصفح. هل أنت متأكد؟"))return;  
  if(!confirm("تأكيد أخير: هل لديك نسخة احتياطية؟"))return;  
  localStorage.removeItem(KEY);  
  db={...emptyData};  
  render();  
}  
  
/* =========================  
   17. قفل التطبيق  
========================= */  
  
function unlockApp(){  
  const pin=document.getElementById("unlockPin").value;  
  if(pin===db.pin){  
    document.getElementById("lockScreen").style.display="none";  
    document.getElementById("lockError").textContent="";  
  }else{  
    document.getElementById("lockError").textContent="رمز PIN غير صحيح";  
  }  
}  
  
function removePin(){  
  if(!confirm("هل تريد إلغاء رمز PIN؟"))return;  
  db.pin="";  
  update();  
  alert("تم إلغاء PIN");  
}  
  
/* =========================  
   18. التذكير بالالتزامات  
========================= */  
  
function checkReminders(){  
  if(!("Notification" in window))return;  
  
  const today=dateNow();  
  const due=db.obligations.filter(o=>!o.paid&&o.due===today);  
  
  if(due.length && Notification.permission==="granted"){  
    new Notification("NAMOW — تذكير بموعد دفع",{  
      body:"عندك "+due.length+" التزام مستحق اليوم"  
    });  
  }  
}  
  
/* =========================  
   19. بدء التطبيق  
========================= */  
  
render();  
monthlyReport();  
  
if(db.pin){  
  document.getElementById("lockScreen").style.display="flex";  
}  
  
document.addEventListener("click",function(e){  
  if(e.target.matches("[data-tab='settings']") &&  
     "Notification" in window &&  
     Notification.permission==="default"){  
    Notification.requestPermission().then(checkReminders);  
  }  
});  
  
checkReminders();  
</script>
